id: hl7.fhir.ie.core
canonical: http://hl7ireland.ie/fhir/core
name: FHIRCoreIreland
title: "FHIR Core Ireland: National EHDS-Aligned Core Implementation Guide"
description: >
  National Core FHIR Implementation Guide for Ireland, aligned with the European
  Health Data Space (EHDS). Reuses HL7 Europe Core profiles wherever they exist and
  nationalises only identifiers (IHI, Eircode), terminology bindings, mandatory
  elements required by Irish law, and local workflows — see the Governance page for
  the full rule set applied before any profiling decision.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
